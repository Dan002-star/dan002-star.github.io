<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>Tabla</title>
</head>
<body>
    <table border="1">
        <thead>
        <tr>
            <th>Columna 1</th>
            <th>Columna 2</th>
            <th>Columna 3</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td colspan="2">col 1+2</td>
            <td rowspan="2">fila 1 col 2</td>
            <td>fila 1 col 3</td>
        </tr>
        <tr>
            <td>fila 2 col 1</td>
            <td>fila 2 col 2</td>
            <td>fila 2 col 3</td>
        </tr>
        </tbody>
    </table>
