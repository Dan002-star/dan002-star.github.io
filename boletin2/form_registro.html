<!DOCTYPE html> 
<html>

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>

<form action="https://lm.ciclo.iesnervion.es/registro.php" method="post">

    <fielset>
    <legend>Campos y restricciones de validación</legend>

        <label for="Códgo de alumno">Códgo de alumno:</label>
        <input type="text" id="Códgo de alumno" name="codigo" required pattern="[A-Z]{3}[0-9]{3}" placeholder="ABC123"><br>

        <label for="Correo Corporativo">Correo Corporativo</label>
        <input type="email" id="Correo Corporativo" name="correo" placeholder="usuario@gmail.es" required> <br>

        <label for="Edad">Edad</label>
        <input type="number" id="Edad" name="edad" required min="16" max="65"> <br>

        <label for="Teléfono de contacto">Teléfono de contacto</label>
        <input type="number" id="Teléfono de contacto" name="telefono" required pattern="[0-9]{9}"> <br>

    </fielset>



    <button type="submit">Enviar</button>
