<!DOCTYPE html> 
<html>

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>

<form action="https://lm.ciclo.iesnervion.es/registro.php" method="post">

<fielset>
    <legend>Registro de desarrolladores</legend>
    

        <label for="Código de alumno">Código de alumno:</label>
        <input type="text" id="Código de alumno" name="codigo" required pattern="[A-Z]{3}[0-9]{3}" placeholder="ABC123"><br>

        <label for="Correo Corporativo">Correo Corporativo</label>
        <input type="email" id="Correo Corporativo" name="email" placeholder="usuario@gmail.es" required> <br>

        <label for="Edad">Edad</label>
        <input type="number" id="Edad" name="edad" required min="16" max="65"> <br>

        <label for="Teléfono de contacto">Teléfono de contacto</label>
        <input type="number" id="Teléfono de contacto" name="telefono" required pattern="[0-9]{9}"> <br>




        
        <label for="IDE Preferido">IDE Preferido</label>
        <input type="text" id="IDE Preferido" name="ide" required> <br>
        <datalist id="IDE Preferido">
            <option value="IntelliJ IDEA">
            <option value="Visual Studio Code">

            <option value="Eclipse">
            <option value="Android Studio">
        </datalist>
            <label for="Aceptación política de privacidad">Aceptación política de privacidad</label> 
            <input type="checkbox" id="Aceptación política de privacidad" required name="politica">
            
            <br>
    

    <button type="submit">Enviar</button>
</fielset>

</body>

</html>
